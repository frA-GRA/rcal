[system]
id = "ASB View"
uuid = "cbeb8cff-4f48-37c8-8534-30b3f190b95e"
default_transport = "asb"

[[system.logging.sink]]
type = "stdout"
level = "error"
format = "pretty"

[[system.logging.sink]]
type = "file"
path = "asb_view.log"
format = "logfmt"
level = "debug"

[[transport]]
id = "asb"
type = "zmq"
uri = "tcp://127.0.0.1:2200"
peers = ["tcp://127.0.0.1:2201"]

[[service]]
id = "asb_view"
topic = [
  {id="Entity"},
  {id="SystemStatus"},
  {id="ServiceStatus"},
  {id="ServiceStatusDataRequest"},
  {id="ServiceStatusDataRequestStatus"},
]

[[service]]
id = "asb_dump"
topic = [
  {id="Entity"},
  {id="SystemStatus"},
  {id="ServiceStatus"},
]
