# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '35 4 * * 2'

jobs:
  lint:
    name: DevSkim
    # Only on main pushes/schedule and release PRs; skip regular PRs and release-plz merges
    if: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')) && !contains(github.event.head_commit.message, '/release-plz-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim-results.sarif
